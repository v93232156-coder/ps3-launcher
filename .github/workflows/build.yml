name: Build_PS3
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PS3Dev
        uses: bucanero/ps3dev-action@v1.1

      - name: Build PKG
        run: |
          make

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: My_App_PKG
          path: ./*.pkg
