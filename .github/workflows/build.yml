name: Build_PS3
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PS3 Dev
        uses: msc-6/setup-ps3dev@v1
        with:
          psl1ght-version: 'master'

      - name: Build PKG
        run: |
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My_PS3_App
          path: ./*.pkg
